name: SoloShot
options:
  bundleIdPrefix: ai.soloshot
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  SoloShotContracts:
    path: ../../packages/contracts/generated/swift
targets:
  SoloShot:
    type: application
    platform: iOS
    sources:
      - path: SoloShot
    dependencies:
      - package: SoloShotContracts
    resources:
      - path: ../h5/public/presets/test-image-v1
        includes:
          - "*-thumb.webp"
    info:
      path: SoloShot/Info.plist
      properties:
        CFBundleDisplayName: SoloShot
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: ai.soloshot.handoff
            CFBundleURLSchemes:
              - soloshot
        SoloShotAPIBaseURL: "$(SOLOSHOT_API_BASE_URL)"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.soloshot.app
        PRODUCT_NAME: SoloShot
        GENERATE_INFOPLIST_FILE: NO
        SOLOSHOT_API_BASE_URL: http://127.0.0.1:8000
        TARGETED_DEVICE_FAMILY: "1"
  SoloShotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SoloShotTests
    dependencies:
      - target: SoloShot
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ai.soloshot.tests
schemes:
  SoloShot:
    build:
      targets:
        SoloShot: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      targets:
        - SoloShotTests
