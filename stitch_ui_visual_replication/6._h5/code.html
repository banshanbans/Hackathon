<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>SoloShot AI - H5 Lightweight Shooting</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&amp;family=Geist:wght@500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-tertiary-fixed": "#001a42",
                        "on-primary": "#591d00",
                        "primary-fixed-dim": "#ffb597",
                        "on-secondary-fixed": "#002109",
                        "outline": "#a78a7f",
                        "on-primary-container": "#511a00",
                        "background": "#111317",
                        "on-tertiary": "#002e6a",
                        "on-secondary-container": "#004119",
                        "secondary-fixed": "#6bff8f",
                        "surface-container-high": "#282a2e",
                        "on-primary-fixed-variant": "#7d2d00",
                        "secondary-fixed-dim": "#4ae176",
                        "surface-container-highest": "#333539",
                        "on-tertiary-fixed-variant": "#004395",
                        "on-secondary": "#003915",
                        "primary-container": "#f06a28",
                        "tertiary-fixed-dim": "#adc6ff",
                        "primary-fixed": "#ffdbcd",
                        "surface": "#111317",
                        "surface-container-low": "#1a1c20",
                        "surface-variant": "#333539",
                        "on-surface-variant": "#e0c0b3",
                        "surface-container-lowest": "#0c0e12",
                        "secondary-container": "#00b954",
                        "on-surface": "#e2e2e8",
                        "inverse-surface": "#e2e2e8",
                        "tertiary": "#adc6ff",
                        "on-error": "#690005",
                        "on-error-container": "#ffdad6",
                        "inverse-on-surface": "#2f3035",
                        "tertiary-fixed": "#d8e2ff",
                        "surface-dim": "#111317",
                        "inverse-primary": "#a43d00",
                        "on-tertiary-container": "#002960",
                        "secondary": "#4ae176",
                        "on-secondary-fixed-variant": "#005321",
                        "on-background": "#e2e2e8",
                        "outline-variant": "#584238",
                        "surface-bright": "#37393e",
                        "tertiary-container": "#5290ff",
                        "error": "#ffb4ab",
                        "surface-tint": "#ffb597",
                        "primary": "#ffb597",
                        "error-container": "#93000a",
                        "surface-container": "#1e2024",
                        "on-primary-fixed": "#360f00"
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    },
                    spacing: {
                        base: "4px",
                        "card-inner-padding": "16px",
                        "grid-gutter": "16px",
                        "stack-gap": "12px",
                        "container-padding": "20px"
                    },
                    fontFamily: {
                        "title-lg": ["Be Vietnam Pro"],
                        "body-md": ["Be Vietnam Pro"],
                        "label-sm": ["Geist"],
                        "headline-md": ["Be Vietnam Pro"],
                        "body-lg": ["Be Vietnam Pro"],
                        "headline-lg": ["Be Vietnam Pro"],
                        "label-md": ["Geist"]
                    },
                    fontSize: {
                        "title-lg": ["18px", { lineHeight: "24px", fontWeight: "600" }],
                        "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
                        "label-sm": ["10px", { lineHeight: "12px", fontWeight: "600" }],
                        "headline-md": ["22px", { lineHeight: "28px", fontWeight: "600" }],
                        "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "headline-lg": ["28px", { lineHeight: "36px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .camera-grid {
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 33.33% 33.33%;
        }
        .silhouette-glow {
            filter: drop-shadow(0 0 8px rgba(240, 106, 40, 0.6));
        }
    </style>
</head>
<body class="bg-background text-on-background h-screen overflow-hidden flex flex-col font-body-md select-none">
<!-- Top App Bar (Suppress default nav for transactional page) -->
<header class="flex justify-between items-center w-full px-container h-14 absolute top-0 z-50 bg-transparent text-on-surface">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-high/50 backdrop-blur-md">
<span class="material-symbols-outlined text-title-lg">close</span>
</button>
<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-high/50 backdrop-blur-md">
<span class="material-symbols-outlined text-title-lg">flash_off</span>
</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-high/50 backdrop-blur-md">
<span class="material-symbols-outlined text-title-lg">camera_front</span>
</button>
</div>
</header>
<!-- Camera Viewfinder Area -->
<main class="relative flex-grow bg-black overflow-hidden flex flex-col justify-center items-center">
<!-- Live Camera Feed Placeholder -->
<div class="absolute inset-0 z-0">
<img alt="Camera Feed" class="w-full h-full object-cover opacity-60" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDM5XzyPPeQee-Xm9doqBbWzgnpAuje1rUsT0gMXy8HDfv6wAvNe8vhDyP-EQchHqWVNXzYEdFp2KdxWnkOqkeyDAM19xUi4r41xBgtnXWl4LR_s6oDpqs7XDZdCOEvSdweUvxM0RJ6NCqLuiDW9wO4oIGy6VOLl9RNnjLqmeI6uauICrZba7EkkXpHDo8yvJEppexg8MHVZODsKDOTmdsZOnX4ttFVtld9JabdqBEt4kzJRIPVid1wbCYvwX-gkeM1r5s"/>
</div>
<!-- Rule of Thirds Grid -->
<div class="absolute inset-0 z-10 camera-grid pointer-events-none"></div>
<!-- Silhouette Guide -->
<div class="absolute z-20 pointer-events-none flex flex-col items-center justify-center h-full w-full">
<svg class="w-2/3 h-2/3 max-h-[60%] text-primary/40 silhouette-glow" fill="currentColor" viewbox="0 0 100 200">
<path d="M50 10 C60 10 65 18 65 30 C65 42 60 50 50 50 C40 50 35 42 35 30 C35 18 40 10 50 10 Z"></path>
<path d="M25 60 C35 55 65 55 75 60 C85 65 90 90 85 110 L80 110 L70 90 L70 190 L55 190 L55 130 L45 130 L45 190 L30 190 L30 90 L20 110 L15 110 C10 90 15 65 25 60 Z"></path>
</svg>
</div>
<!-- Center Target Box -->
<div class="absolute z-10 w-48 h-64 border-2 border-primary/50 border-dashed rounded-lg pointer-events-none flex items-center justify-center">
<div class="w-2 h-2 rounded-full bg-primary/80"></div>
</div>
<!-- Hint Overlay -->
<div class="absolute bottom-8 z-20 w-full px-6 flex justify-center">
<div class="bg-surface-container-highest/80 backdrop-blur-md rounded-lg py-2 px-4 text-center">
<p class="font-label-sm text-on-surface-variant flex items-center gap-1 justify-center">
<span class="material-symbols-outlined text-label-sm">info</span>
                    H5 无法进行 iOS 级实时追踪与提示，仅提供构图参考
                </p>
</div>
</div>
</main>
<!-- Bottom Controls Area -->
<footer class="bg-surface-container/90 backdrop-blur-xl w-full z-50 flex flex-col px-4 pt-4 pb-safe rounded-t-xl relative border-t border-outline-variant shadow-xl">
<!-- Tab Bar (Photo / Upload) -->
<div class="flex justify-center gap-8 mb-6 border-b border-surface-variant pb-2">
<button class="font-title-lg text-primary border-b-2 border-primary pb-1">拍照/录像</button>
<button class="font-title-lg text-on-surface-variant pb-1 flex items-center gap-1">
<span class="material-symbols-outlined text-title-lg">upload</span> 上传文件
            </button>
</div>
<!-- Primary Action Buttons -->
<div class="flex justify-between items-center mb-6 px-6">
<button class="flex flex-col items-center justify-center text-on-surface hover:opacity-80">
<div class="w-12 h-12 rounded-lg bg-surface-container-highest flex items-center justify-center mb-1">
<span class="material-symbols-outlined text-headline-md">photo_library</span>
</div>
<span class="font-label-sm">相册</span>
</button>
<!-- Shutter Button -->
<button class="relative w-20 h-20 flex items-center justify-center">
<div class="absolute inset-0 rounded-full border-4 border-on-surface"></div>
<div class="w-16 h-16 rounded-full bg-primary-container hover:bg-primary active:scale-95 transition-all duration-200"></div>
</button>
<button class="flex flex-col items-center justify-center text-on-surface hover:opacity-80">
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center mb-1">
<span class="material-symbols-outlined text-headline-md">sync</span>
</div>
<span class="font-label-sm">切换</span>
</button>
</div>
<!-- Format Hint -->
<div class="text-center mb-4">
<p class="font-label-sm text-on-surface-variant">建议竖拍 9:16，MP4 或 JPG，文件 ≤ 200MB</p>
</div>
<!-- Upload Progress Toast (Visible State) -->
<div class="bg-surface-container-highest rounded-lg p-3 flex items-center justify-between mx-2 mb-2">
<div class="flex-grow pr-4">
<div class="flex justify-between items-end mb-1">
<span class="font-label-md text-on-surface">上传中... <span class="text-primary font-bold">34%</span></span>
<span class="font-label-sm text-on-surface-variant">(12.4MB / 36.2MB)</span>
</div>
<div class="w-full bg-surface-variant rounded-full h-1.5">
<div class="bg-primary h-1.5 rounded-full" style="width: 34%"></div>
</div>
</div>
<button class="text-on-surface-variant hover:text-on-surface ml-2">
<span class="material-symbols-outlined">close</span>
</button>
</div>
</footer>
</body></html>
