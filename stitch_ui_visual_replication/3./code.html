<style>
        body { background-color: theme('colors.background'); color: theme('colors.on-surface'); }
        .glass-panel { background: rgba(30, 32, 36, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid theme('colors.outline-variant'); }
        .toggle-btn.active { background-color: theme('colors.primary-container'); color: white; border-color: theme('colors.primary-container'); }
        .toggle-btn { background-color: theme('colors.surface-container-high'); color: theme('colors.on-surface'); border: 1px solid theme('colors.outline-variant'); transition: all 0.2s ease; }
        .mode-card.active { border-color: theme('colors.primary-container'); background-color: rgba(240, 106, 40, 0.1); }
        .mode-card { border: 1px solid theme('colors.outline-variant'); background-color: theme('colors.surface-container'); transition: all 0.2s ease; cursor: pointer; }
        
        /* Custom scrollbar for text area */
        textarea::-webkit-scrollbar { width: 4px; }
        textarea::-webkit-scrollbar-track { background: transparent; }
        textarea::-webkit-scrollbar-thumb { background: theme('colors.surface-variant'); border-radius: 4px; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="antialiased min-h-screen flex flex-col relative overflow-x-hidden">
<!-- Background Pattern -->
<div class="fixed inset-0 z-0 pointer-events-none opacity-20" style="background-image: radial-gradient(circle at 50% 0%, theme('colors.primary-container') 0%, transparent 50%);"></div>
<!-- Top App Bar (From Shared Components) -->
<header class="flex justify-between items-center w-full px-container h-14 sticky top-0 z-50 bg-surface/70 dark:bg-surface/70 backdrop-blur-xl">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary dark:text-primary">camera_outdoor</span>
<h1 class="text-headline-md font-headline-md font-bold text-on-surface dark:text-on-surface">SoloShot AI</h1>
</div>
<button class="p-2 hover:opacity-80 transition-all duration-200 text-on-surface-variant">
<span class="material-symbols-outlined">more_vert</span>
</button>
</header>
<!-- Main Canvas -->
<main class="flex-grow z-10 px-container pb-[100px] flex flex-col gap-stack-gap">
<h2 class="text-title-lg font-title-lg text-on-surface mt-4 mb-2">你的旅行与器材情况</h2>
<!-- Form Section -->
<div class="glass-panel rounded-xl p-card-inner-padding flex flex-col gap-4">
<!-- Question 1 -->
<div class="flex items-center justify-between">
<span class="text-body-md font-body-md text-on-surface">独自旅行</span>
<div class="flex gap-2">
<button class="toggle-btn active px-6 py-2 rounded-lg text-body-md font-body-md flex items-center gap-1">
                        是 <span class="material-symbols-outlined text-[16px] text-white">check_circle</span>
</button>
<button class="toggle-btn px-6 py-2 rounded-lg text-body-md font-body-md">
                        否
                    </button>
</div>
</div>
<!-- Question 2 -->
<div class="flex items-center justify-between">
<span class="text-body-md font-body-md text-on-surface">有无三脚架</span>
<div class="flex gap-2">
<button class="toggle-btn px-6 py-2 rounded-lg text-body-md font-body-md">
                        有
                    </button>
<button class="toggle-btn active px-6 py-2 rounded-lg text-body-md font-body-md flex items-center gap-1">
                        无 <span class="material-symbols-outlined text-[16px] text-white">check_circle</span>
</button>
</div>
</div>
<!-- Question 3 -->
<div class="flex items-center justify-between">
<span class="text-body-md font-body-md text-on-surface">是否携带行李</span>
<div class="flex gap-2">
<button class="toggle-btn active px-6 py-2 rounded-lg text-body-md font-body-md flex items-center gap-1">
                        是 <span class="material-symbols-outlined text-[16px] text-white">check_circle</span>
</button>
<button class="toggle-btn px-6 py-2 rounded-lg text-body-md font-body-md">
                        否
                    </button>
</div>
</div>
<!-- Text Area -->
<div class="mt-2 relative">
<textarea class="w-full bg-[#16191E] border-none rounded-lg p-3 text-body-md font-body-md text-on-surface placeholder-on-surface-variant focus:ring-1 focus:ring-primary-container resize-none h-24" placeholder="可选: 如天气、时间、路况等"></textarea>
<span class="absolute bottom-3 right-3 text-label-sm font-label-sm text-on-surface-variant">0/60</span>
</div>
</div>
<h2 class="text-title-lg font-title-lg text-on-surface mt-6 mb-2">选择执行模式</h2>
<!-- Mode Selection Cards -->
<div class="flex flex-col gap-3">
<!-- Mode 1 (Selected) -->
<div class="mode-card active rounded-xl p-card-inner-padding flex items-start gap-4">
<div class="w-16 h-16 rounded-lg bg-surface overflow-hidden shrink-0">
<img class="w-full h-full object-cover" data-alt="A cinematic, high-contrast digital photograph of a solo traveler framing a shot with their hands against a stunning sunset over a coastal Italian village. The lighting is warm and golden, emphasizing the creative process. The scene is shot from a slightly low angle, conveying a sense of artistic vision." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDWxMMBKS_VUkHBcVsGaIxAqycs7wlfbek7H4loPpm7WFvf2xC5tcdaAQG4Pe-EBcrJHFEXEaKkg-GSVhB8gN1bKRQBTmhpD6rGCA_BVVInWXl8zHKVEUGPpYWJrU7yaMOoAkAFW37Gx3D1FONXX7H2zxtQ5ovWWY2rqgLsJHQ6FzQPXYkCO3rMO2ulKiJP1e5-LYbO0XUCgTjvj7c0J1bC2v-P35z55HjVOkYpLlj_53-Foo7Ltl67uw"/>
</div>
<div class="flex-grow">
<h3 class="text-body-lg font-body-lg font-semibold text-primary-container mb-1">原图复刻</h3>
<p class="text-label-md font-label-md text-on-surface-variant">尽量保持构图、视角与氛围一致，<br/>还原你看到的理想镜头。</p>
</div>
<span class="material-symbols-outlined text-primary-container mt-1">check_circle</span>
</div>
<!-- Mode 2 -->
<div class="mode-card rounded-xl p-card-inner-padding flex items-start gap-4 opacity-70 hover:opacity-100">
<div class="w-16 h-16 rounded-lg bg-surface overflow-hidden shrink-0">
<img class="w-full h-full object-cover grayscale opacity-80" data-alt="A split-screen digital rendering showing a reference photo of a vibrant city street on one side and a newly generated, stylized AI interpretation on the other. The lighting is neon-infused cyberpunk, contrasting with the daylight reality. The mood is futuristic and experimental." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC1pIBkLaxL9_VcANJ91rm-54D3nmcNhGCNfR47JCS5tgYiLAtaameXJSmhQmA5BB2dEGxua_z9K97Ph6wWXAfm4jQWISdjerv17UU6ULROsbhmk2hweyC3NTbnZMqQNQdWKNB_gfrHLhkC8E8wcxL3kacJa20V_zaIDOZOMb3s0MCCNcoL-CTp23ZxJUreCVb1O7lDAd0M6d_JFamkY_TuEqekuwnPANjc5wyQVtKswnjaZPZ44hZzSQ"/>
</div>
<div class="flex-grow">
<h3 class="text-body-lg font-body-lg font-semibold text-on-surface mb-1">灵感迁移</h3>
<p class="text-label-md font-label-md text-on-surface-variant">在保留原图的基础上，调整构图与<br/>视角，匹配现场环境与条件。</p>
</div>
<span class="material-symbols-outlined text-outline-variant mt-1">radio_button_unchecked</span>
</div>
</div>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full p-container-padding bg-background/90 backdrop-blur-md z-40 border-t border-outline-variant">
<button class="w-full bg-primary-container text-white py-4 rounded-xl text-title-lg font-title-lg font-semibold shadow-[0_inset_0_1px_rgba(255,255,255,0.3)] hover:opacity-90 active:scale-[0.98] transition-all">
            下一步，生成拍摄方案
        </button>
</div>
<!-- Hidden Navigation Shells (Suppressed per semantic mandate as this is a linear task flow) -->
</body></html>
