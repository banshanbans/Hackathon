<!DOCTYPE html>

<html class="dark" lang="en"><head>

<style>
        .drag-handle {
            width: 12px;
            height: 12px;
            background-color: white;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 4px rgba(0,0,0,0.5);
        }
        .bounding-box {
            border: 2px dashed rgba(255, 255, 255, 0.8);
            position: absolute;
            top: 20%;
            left: 30%;
            width: 40%;
            height: 50%;
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(2px);
        }
        .drag-handle.tl { top: -6px; left: -6px; }
        .drag-handle.tr { top: -6px; right: -6px; }
        .drag-handle.bl { bottom: -6px; left: -6px; }
        .drag-handle.br { bottom: -6px; right: -6px; }
        
        /* Inner glow for primary button */
        .btn-primary-glow {
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md h-screen flex flex-col overflow-hidden w-full max-w-md mx-auto relative shadow-2xl border-x border-surface-container-high md:mt-8 md:h-[800px] md:rounded-[40px] md:border-y">
<!-- Header (Suppressed top app bar as this is a task-focused screen, using minimal custom header) -->
<header class="flex justify-between items-center w-full px-container-padding py-4 absolute top-0 z-10 bg-gradient-to-b from-background/80 to-transparent">
<div class="text-on-surface flex items-center gap-2">
<span class="text-body-md">9:41</span>
</div>
<div class="flex gap-2 text-on-surface">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">signal_cellular_4_bar</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">wifi</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">battery_full</span>
</div>
</header>
<!-- Main Canvas Area -->
<main class="flex-grow relative w-full bg-black flex flex-col">
<!-- Instruction Overlay -->
<div class="absolute top-16 left-0 w-full z-20 flex justify-center pointer-events-none">
<div class="bg-surface-container-high/80 backdrop-blur-md px-4 py-2 rounded-full border border-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-on-surface-variant text-sm">pinch</span>
<span class="text-body-md text-on-surface">拖拽调整框选，仅追踪 1 个人</span>
<span class="material-symbols-outlined text-on-surface-variant text-sm">help</span>
</div>
</div>
<!-- Video/Image Container -->
<div class="relative w-full flex-grow overflow-hidden bg-surface-container-lowest flex items-center justify-center">
<!-- Simulated Video Frame -->
<img alt="Reference Shot" class="object-cover w-full h-full opacity-80" data-alt="A cinematic medium shot of a woman with long hair wearing a black dress, standing on a cliff overlooking a picturesque coastal town at sunset. The lighting is warm and dramatic. Shot on high-end cinema camera." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBPdjZUitpidmgQ6eqrepR_3NGJ1IpM7cCjc_9H-8MK-u7nX4auETwh3f0TRSj92Xb9I1dER2pV1e2PskEeKjrG3Rybb9Aw9vneZbeR63WrryNY6eAc7vPORmxPHYXi-I2nn18QLnQ9uLJ21leAUEM_kfLOlKyt_-vfZHQyn0Z9kWsPZ8xqryuUYG2t9hl2P0W6ETtoK_8m0z0hRW2S718L55_4TGfR5PIWhAeLt2bgSS5ou9uwn3O6uD7yO88_5WO5uNs"/>
<!-- Bounding Box Interaction Area -->
<div class="absolute inset-0">
<div class="bounding-box cursor-move">
<div class="drag-handle tl cursor-nwse-resize flex items-center justify-center"><span class="material-symbols-outlined text-[8px] text-black">close</span></div>
<div class="drag-handle tr cursor-nesw-resize"></div>
<div class="drag-handle bl cursor-nesw-resize"></div>
<div class="drag-handle br cursor-nwse-resize flex items-center justify-center">
<span class="material-symbols-outlined text-[8px] text-black">open_in_full</span>
</div>
</div>
</div>
</div>
<!-- Bottom Controls Area -->
<div class="bg-surface-container/90 backdrop-blur-xl border-t border-surface-variant w-full rounded-t-xl px-container-padding py-stack-gap flex flex-col gap-stack-gap z-20 pb-safe pb-8">
<!-- Timeline / Scrubber -->
<div class="flex items-center gap-3 w-full">
<button class="text-on-surface p-2 rounded-full hover:bg-surface-variant transition-colors flex-shrink-0">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
<div class="flex-grow flex flex-col gap-1 relative">
<!-- Filmstrip thumbnails (simulated) -->
<div class="flex h-10 w-full rounded-md overflow-hidden bg-surface-container-highest border border-surface-variant relative opacity-60">
<div class="w-1/5 h-full bg-surface-variant border-r border-surface"></div>
<div class="w-1/5 h-full bg-surface-variant/80 border-r border-surface"></div>
<div class="w-1/5 h-full bg-surface-variant/60 border-r border-surface"></div>
<div class="w-1/5 h-full bg-surface-variant/40 border-r border-surface"></div>
<div class="w-1/5 h-full bg-surface-variant/20"></div>
<!-- Active frame indicator -->
<div class="absolute top-0 bottom-0 left-[40%] w-[20%] border-2 border-primary rounded-sm bg-primary/10 shadow-[0_0_10px_rgba(240,106,40,0.5)]"></div>
</div>
<div class="w-full h-1 bg-surface-variant rounded-full mt-1 relative">
<div class="absolute left-0 top-0 bottom-0 w-[45%] bg-primary rounded-full"></div>
<div class="absolute left-[45%] top-1/2 -translate-y-1/2 w-3 h-3 bg-primary rounded-full shadow-md"></div>
</div>
</div>
<span class="text-label-sm font-label-sm text-on-surface-variant flex-shrink-0 whitespace-nowrap">
                    00:00 / 00:15
                </span>
</div>
<!-- Action Buttons -->
<div class="flex gap-2 w-full mt-2">
<button class="flex-1 bg-transparent border border-surface-variant text-on-surface py-3 px-4 rounded-lg font-body-md text-body-md hover:bg-surface-variant transition-colors">
                    重置
                </button>
<button class="flex-1 bg-transparent border border-surface-variant text-on-surface py-3 px-4 rounded-lg font-body-md text-body-md hover:bg-surface-variant transition-colors">
                    重新选帧
                </button>
<button class="flex-[1.5] bg-primary-container text-white py-3 px-4 rounded-lg font-title-lg text-title-lg btn-primary-glow hover:bg-primary-container/90 transition-colors flex items-center justify-center">
                    确认人物
                </button>
</div>
</div>
</main>
<!-- Script for basic interaction demo (optional micro-interactions) -->
<script>
        // Simple script to make bounding box feel slightly interactive for demo purposes
        document.addEventListener('DOMContentLoaded', () => {
            const box = document.querySelector('.bounding-box');
            if(box) {
                box.addEventListener('mousedown', () => box.style.borderColor = '#f06a28');
                box.addEventListener('mouseup', () => box.style.borderColor = 'rgba(255, 255, 255, 0.8)');
                box.addEventListener('mouseleave', () => box.style.borderColor = 'rgba(255, 255, 255, 0.8)');
                box.addEventListener('touchstart', () => box.style.borderColor = '#f06a28');
                box.addEventListener('touchend', () => box.style.borderColor = 'rgba(255, 255, 255, 0.8)');
            }
        });
    </script>
</body></html>
