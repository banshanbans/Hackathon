<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>SoloShot AI - Handoff</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&amp;family=Geist:wght@500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed": "#001a42",
                        "on-primary": "#591d00",
                        "primary-fixed-dim": "#ffb597",
                        "on-secondary-fixed": "#002109",
                        "outline": "#a78a7f",
                        "on-primary-container": "#511a00",
                        "background": "#111317",
                        "on-tertiary": "#002e6a",
                        "on-secondary-container": "#004119",
                        "secondary-fixed": "#6bff8f",
                        "surface-container-high": "#282a2e",
                        "on-primary-fixed-variant": "#7d2d00",
                        "secondary-fixed-dim": "#4ae176",
                        "surface-container-highest": "#333539",
                        "on-tertiary-fixed-variant": "#004395",
                        "on-secondary": "#003915",
                        "primary-container": "#f06a28",
                        "tertiary-fixed-dim": "#adc6ff",
                        "primary-fixed": "#ffdbcd",
                        "surface": "#111317",
                        "surface-container-low": "#1a1c20",
                        "surface-variant": "#333539",
                        "on-surface-variant": "#e0c0b3",
                        "surface-container-lowest": "#0c0e12",
                        "secondary-container": "#00b954",
                        "on-surface": "#e2e2e8",
                        "inverse-surface": "#e2e2e8",
                        "tertiary": "#adc6ff",
                        "on-error": "#690005",
                        "on-error-container": "#ffdad6",
                        "inverse-on-surface": "#2f3035",
                        "tertiary-fixed": "#d8e2ff",
                        "surface-dim": "#111317",
                        "inverse-primary": "#a43d00",
                        "on-tertiary-container": "#002960",
                        "secondary": "#4ae176",
                        "on-secondary-fixed-variant": "#005321",
                        "on-background": "#e2e2e8",
                        "outline-variant": "#584238",
                        "surface-bright": "#37393e",
                        "tertiary-container": "#5290ff",
                        "error": "#ffb4ab",
                        "surface-tint": "#ffb597",
                        "primary": "#ffb597",
                        "error-container": "#93000a",
                        "surface-container": "#1e2024",
                        "on-primary-fixed": "#360f00"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "4px",
                        "card-inner-padding": "16px",
                        "grid-gutter": "16px",
                        "stack-gap": "12px",
                        "container-padding": "20px"
                    },
                    "fontFamily": {
                        "title-lg": ["Be Vietnam Pro"],
                        "body-md": ["Be Vietnam Pro"],
                        "label-sm": ["Geist"],
                        "headline-md": ["Be Vietnam Pro"],
                        "body-lg": ["Be Vietnam Pro"],
                        "headline-lg": ["Be Vietnam Pro"],
                        "label-md": ["Geist"]
                    },
                    "fontSize": {
                        "title-lg": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-sm": ["10px", { "lineHeight": "12px", "fontWeight": "600" }],

                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Minimal custom styles, heavily relying on Tailwind */
        body {
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(30, 32, 36, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(45, 49, 57, 0.8);
        }

        /* Pulse animation for active states */
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .animate-pulse-slow {
            animation: pulse-slow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased select-none">
<!-- Top App Bar (Intent: Handoff/Transactional, Nav suppressed but Header remains) -->
<header class="flex justify-between items-center w-full px-container h-14 sticky top-0 z-50 bg-surface/70 backdrop-blur-xl transition-all duration-200">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">camera_outdoor</span>
<span class="text-headline-md font-headline-md font-bold text-on-surface">SoloShot AI</span>
</div>
<!-- Close action for transactional flow -->
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors group">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-on-surface">close</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-container py-4 flex flex-col max-w-md mx-auto w-full gap-stack-gap pb-[env(safe-area-inset-bottom)]">
<!-- Header Section -->
<div class="flex items-center justify-between mb-2">
<h1 class="text-title-lg font-title-lg text-on-surface">分享给你的 iPhone 陪拍</h1>
<span class="text-label-sm font-label-sm px-2 py-1 bg-surface-variant text-on-surface-variant rounded-full border border-outline-variant">示例</span>
</div>
<!-- Main Handoff Card -->
<div class="glass-panel rounded-xl p-card-inner-padding flex flex-col items-center shadow-[inset_0_1px_0_rgba(255,255,255,0.05)] relative overflow-hidden">
<!-- Subtle gradient glow -->
<div class="absolute top-0 inset-x-0 h-32 bg-gradient-to-b from-primary/10 to-transparent pointer-events-none"></div>
<!-- QR Code Container -->
<div class="bg-white p-3 rounded-lg mb-6 shadow-lg">
<!-- Using a placeholder for the QR code to fit design system -->
<div class="w-40 h-40 bg-surface-variant flex items-center justify-center rounded border border-outline-variant/30" data-alt="A high-contrast, black and white matrix barcode (QR code) designed for quick scanning by a smartphone camera, isolated on a clean white square background. The aesthetic is purely functional and digital, typical of modern app pairing processes. No other elements are present." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBmpBTWTZCRUFttMVTYhtoCr9bKR0ERaphOd-MtC6TOpoF3rQWm43sMI2nyJkO-7RD0QCBsDrNef1Mu74ao1WA-UDDYTvIHBcN5FTnyTsXQN36K15zCnzSGm285OuZS1RAZUKU9nUrYoXE_qPj1lAyz3MMFf7hN3vEw7GKS7AaiYyIDQRskMW2CKLINKiY4eO4NaP-eVqUV-ISm01Hz3WF2rwB63gTZM-DKpKAkzczoEvhndMXXvMzutA')">
<!-- Fallback if image fails or before load -->
<span class="material-symbols-outlined text-surface-container text-4xl hidden">qr_code_2</span>
</div>
</div>
<!-- Mission Code -->
<div class="w-full">
<p class="text-label-md font-label-md text-on-surface-variant mb-2 text-center">六位任务码</p>
<div class="flex items-center justify-center gap-3 bg-surface-container-highest rounded-lg py-3 px-4 border border-outline-variant/50">
<span class="text-headline-lg font-headline-lg tracking-[0.25em] text-primary">728531</span>
<button class="text-on-surface-variant hover:text-primary transition-colors ml-2 active:scale-95">
<span class="material-symbols-outlined text-[20px]">content_copy</span>
</button>
</div>
</div>
<p class="text-label-sm font-label-sm text-on-surface-variant mt-4 text-center opacity-80">
                用相机或 Safari 扫码领取任务
            </p>
</div>
<!-- Session Summary Details -->
<div class="bg-surface-container rounded-xl p-card-inner-padding border border-outline-variant/30">
<h2 class="text-body-md font-body-md font-semibold text-on-surface mb-3 flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-primary">shield_person</span>
                会话安全摘要
            </h2>
<ul class="space-y-3">
<li class="flex items-start gap-3">
<span class="material-symbols-outlined text-[16px] text-secondary mt-0.5">check_circle</span>
<span class="text-body-md font-body-md text-on-surface-variant">仅授权陪拍，不读取相册</span>
</li>
<li class="flex items-start gap-3">
<span class="material-symbols-outlined text-[16px] text-secondary mt-0.5">lock</span>
<span class="text-body-md font-body-md text-on-surface-variant">iCloud 端到端加密传输</span>
</li>
<li class="flex items-start gap-3">
<span class="material-symbols-outlined text-[16px] text-secondary mt-0.5">no_photography</span>
<span class="text-body-md font-body-md text-on-surface-variant">不记录位置，不保存视频</span>
</li>
</ul>
</div>
<!-- Countdown Timer -->
<div class="flex items-center justify-between bg-surface-container-low rounded-xl px-4 py-3 border border-outline-variant/20 mt-2">
<span class="text-body-md font-body-md text-on-surface-variant">过期倒计时</span>
<div class="flex items-center gap-1 font-mono">
<div class="bg-primary-container text-on-primary-container px-2 py-1 rounded text-body-md font-bold shadow-inner">29</div>
<span class="text-on-surface font-bold animate-pulse-slow">:</span>
<div class="bg-surface-variant text-on-surface px-2 py-1 rounded text-body-md font-bold">49</div>
<span class="text-body-md font-body-md text-on-surface-variant ml-2">后过期</span>
</div>
</div>
<div class="flex-grow"></div>
<!-- Action Buttons -->
<div class="flex gap-4 mt-6 mb-8">
<button class="flex-1 py-3 px-4 rounded-lg border border-outline-variant text-on-surface font-body-md bg-surface-container hover:bg-surface-variant transition-colors active:scale-[0.98]">
                撤销分享
            </button>
<button class="flex-1 py-3 px-4 rounded-lg bg-primary-container text-white font-body-md font-semibold flex items-center justify-center gap-2 hover:bg-primary/90 transition-colors shadow-[inset_0_1px_0_rgba(255,255,255,0.2)] active:scale-[0.98]">
<span class="material-symbols-outlined text-[18px]">refresh</span>
                重新生成
            </button>
</div>
<!-- Status Legend (Bottom) -->
<div class="flex flex-wrap items-center gap-3 pt-4 border-t border-outline-variant/30">
<span class="text-label-sm font-label-sm text-on-surface-variant">状态说明</span>
<div class="flex gap-2">
<span class="text-[10px] px-2 py-0.5 rounded bg-surface-variant text-on-surface border border-outline-variant/50">待领取</span>
<span class="text-[10px] px-2 py-0.5 rounded bg-primary-container/20 text-primary border border-primary/30">已领取</span>
<span class="text-[10px] px-2 py-0.5 rounded bg-secondary-container/20 text-secondary border border-secondary/30">已完成</span>
<span class="text-[10px] px-2 py-0.5 rounded bg-surface-variant text-on-surface-variant opacity-60 border border-outline-variant/30">已撤销</span>
<span class="text-[10px] px-2 py-0.5 rounded bg-surface-variant text-on-surface-variant opacity-60 border border-outline-variant/30">已过期</span>
</div>
</div>
</main>
<!-- Navigation Shell suppressed due to transactional nature of page -->
</body></html>
