<script>
        // Minimal script to handle button presses for visual feedback
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                btn.style.transform = 'scale(0.98)';
            }, {passive: true});
            btn.addEventListener('touchend', () => {
                btn.style.transform = '';
            }, {passive: true});
        });
    </script>
